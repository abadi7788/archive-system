name: Auto Deploy Archive System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code and rebuild Docker
        shell: cmd
        run: |
          cd /d D:\archive-system
          git config --global --add safe.directory D:/archive-system
          git pull origin main
          docker compose up -d --build
