name: Auto Deploy Archive System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code and rebuild Docker
        shell: cmd
        env:
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "never"
        run: |
          cd /d D:\archive-system
          git config --global --add safe.directory D:/archive-system
          git -c credential.helper= pull https://x-access-token:${{ github.token }}@github.com/abadi7788/archive-system.git main
          docker compose up -d --build
