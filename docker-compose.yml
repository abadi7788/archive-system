services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archive_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-archive_system_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archive_admin} -d ${POSTGRES_DB:-archive_system_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [archive]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      POSTGRES_USER: ${POSTGRES_USER:-archive_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-archive_system_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?Set MASTER_ENCRYPTION_KEY in .env}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD:?Set MASTER_ADMIN_PASSWORD in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OCR_RETRY_INTERVAL_SECONDS: ${OCR_RETRY_INTERVAL_SECONDS:-120}
      OCR_RETRY_BATCH_SIZE: ${OCR_RETRY_BATCH_SIZE:-20}
      SYSTEM_GEMINI_KEY_1: ${SYSTEM_GEMINI_KEY_1:-}
      SYSTEM_GEMINI_KEY_2: ${SYSTEM_GEMINI_KEY_2:-}
      SYSTEM_GEMINI_KEY_3: ${SYSTEM_GEMINI_KEY_3:-}
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT: /data/archive
    volumes:
      - archive_documents:/data/archive
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [archive]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks: [archive]

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    networks: [archive]

volumes:
  postgres_data:
  archive_documents:
  caddy_data:
  caddy_config:

networks:
  archive:
    driver: bridge
